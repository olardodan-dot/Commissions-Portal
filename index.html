<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commissions Calculation · Sign in</title><style>body{margin:0;background:#eff5f8;color:#173b4c;font:16px system-ui,sans-serif}main{max-width:430px;margin:9vh auto;background:white;padding:36px;border:1px solid #d5e3ea;border-radius:18px}small{color:#007fa3;font-weight:700}h1{font-size:28px;margin:12px 0}p{line-height:1.5;color:#567180}label{display:block;margin-top:20px;font-weight:600}input{box-sizing:border-box;width:100%;font:inherit;border:1px solid #bed2de;border-radius:8px;padding:12px;margin-top:7px}button{font:inherit;background:#007fa3;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}form button{width:100%;margin-top:25px}#message{color:#925315;white-space:pre-wrap}footer{font-size:12px;margin-top:24px;color:#6b8290}@media(max-width:550px){main{margin:30px 16px;padding:24px}}</style></head><body><main><small>QIAGEN · NORTH AMERICA</small><h1>Commissions Calculation</h1><p>Sign in to your shared commissions workspace.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="signin" type="submit">Sign in</button></form><p id="message" role="status"></p><footer>Draft 19 · Access is limited to approved users.</footer></main><script>
(()=>{'use strict';
 const API='https://nbdeataurfbuibhocndw.supabase.co',KEY='sb_publishable_Id9inAHu2hdPJPGwHVBwIA_EfJIwN-G',SESSION='commissions-auth-v1';
 let session=null,refreshing=null,stopped=false,saving=false,lastError='',conflict=false,lastSaved=null,draftWarning='';const memory=new Map(),versions=new Map(),pending=new Map();
 const byId=id=>document.getElementById(id),msg=s=>{const el=byId('message');if(el)el.textContent=s};
 function status(s,error=false){const el=byId('shared-save-status');if(el){el.textContent=s;el.style.color=error?'#a42c2c':''}const bar=byId('commission-save-notice');if(bar){const state=error?'error':saving||pending.size?'saving':'saved';bar.dataset.state=state;byId('commission-save-label').textContent=error?'Save failed — changes need attention':state==='saving'?'Saving… keep this tab open':lastSaved?'Saved at '+lastSaved.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'}):'Shared data loaded';byId('commission-save-detail').textContent=error?s:state==='saving'?'Waiting for confirmation from the shared workspace.':lastSaved?'Your latest edits are confirmed saved. You can close your laptop.':'New edits save automatically. Wait for “Saved at” before closing.';byId('commission-save-retry').hidden=!error||conflict;byId('commission-save-backup').hidden=!error;byId('commission-save-reload').hidden=!error;bar.setAttribute('aria-live',error?'assertive':'polite')}const main=document.querySelector('main');if(main)main.inert=conflict;const out=byId('shared-signout');if(out)out.disabled=saving||pending.size>0||stopped}
 function equalJson(a,b){if(a===b)return true;if(!a||!b||typeof a!=='object'||typeof b!=='object'||Array.isArray(a)!==Array.isArray(b))return false;const keys=Object.keys(a);return keys.length===Object.keys(b).length&&keys.every(k=>Object.prototype.hasOwnProperty.call(b,k)&&equalJson(a[k],b[k]))}
 function draftKey(){return 'commission-unsaved-v1-'+session.user.id}
 function persistDraft(){const entries=[...pending].map(([key,value])=>({key,value,revision:versions.get(key)}));if(entries.length)window.localStorage.setItem(draftKey(),JSON.stringify({savedAt:new Date().toISOString(),entries}));else window.localStorage.removeItem(draftKey())}
 function backupDraft(){const data=window.localStorage.getItem(draftKey())||JSON.stringify({entries:[...pending].map(([key,value])=>({key,value,revision:versions.get(key)}))});const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='Commission_unsaved_changes_'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

 function remember(s){session={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600),user:s.user};window.localStorage.setItem(SESSION,JSON.stringify(session))}
 async function token(){if(!session)throw Error('Please sign in again.');if(session.expires_at>Date.now()/1000+60)return session.access_token;if(!refreshing)refreshing=(async()=>{const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});const d=await r.json();if(!r.ok)throw Error('Your session expired. Reload and sign in again.');remember(d);return session.access_token})().finally(()=>refreshing=null);return refreshing}
 async function request(path,options={}){const access=await token(),r=await fetch(API+'/rest/v1/'+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json',Prefer:'return=representation',...(options.headers||{})}});const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch(e){throw Error('The server returned an unexpected response.')}if(!r.ok)throw Error(d?.message||'The shared workspace could not be reached.');return d}
 function identity(key){if(key==='mto-hid-commissions-v1')return {scope:'hid',plan_year:2026};const m=/^mto-(genomics|biopharma)-(\d{4})$/.exec(key);if(!m)throw Error('Unsupported shared data record.');return {scope:m[1]==='biopharma'?'mto-biopharma':m[1],plan_year:Number(m[2])}}
 function storageKey(row){return row.scope==='hid'?'mto-hid-commissions-v1':row.scope==='genomics'?'mto-genomics-'+row.plan_year:row.scope==='mto-biopharma'?'mto-biopharma-'+row.plan_year:null}
 async function flush(){if(saving||stopped||!pending.size)return;saving=true;status('Saving changes…');try{while(pending.size){const [key,value]=pending.entries().next().value;const id=identity(key),rev=versions.get(key),path='commission_datasets?scope=eq.'+id.scope+'&plan_year=eq.'+id.plan_year;let rows;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{if(rev===undefined)rows=await request('commission_datasets',{method:'POST',signal:controller.signal,body:JSON.stringify({...id,payload:{value}})});else rows=await request(path+'&revision=eq.'+rev,{method:'PATCH',signal:controller.signal,body:JSON.stringify({payload:{value}})})}finally{clearTimeout(timeout)}if(!rows?.length){const latest=await request(path+'&select=revision,payload');if(latest?.length&&equalJson(latest[0].payload.value,value))rows=latest;else{conflict=true;throw Error('Newer shared data exists. Your unsaved draft is retained in this browser. Download the draft, then reload shared data; no newer figures have been overwritten.')}}versions.set(key,rows[0].revision);if(pending.get(key)===value)pending.delete(key);persistDraft()}lastSaved=new Date();lastError='';conflict=false}catch(e){stopped=true;lastError=e.name==='AbortError'?'The save timed out. Your draft is retained. Retry when connected.':e.message}finally{saving=false;status(stopped?lastError:pending.size?'Saving changes…':'All changes saved to shared workspace',stopped)}}
 const storage={getItem:key=>memory.get(key)??null,setItem(key,value){identity(key);if(conflict){status(lastError,true);throw Error('Resolve the shared-data conflict using the save notice before editing further.')}const parsed=JSON.parse(value);memory.set(key,String(value));pending.set(key,parsed);try{persistDraft()}catch(e){stopped=true;lastError='Browser draft storage failed. Keep this tab open and download your unsaved draft.';status(lastError,true);return}status(stopped?lastError:'Saving changes…',stopped);if(!stopped)queueMicrotask(flush)},removeItem(){throw Error('Shared records cannot be removed through browser storage.')}};

 async function signout(){if(saving||pending.size)return;if(stopped&&!confirm('Some changes are not saved. Sign out and discard those changes?'))return;try{await fetch(API+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+await token()}})}finally{window.localStorage.removeItem(SESSION);session=null;location.reload()}}
 function attach(){byId('shared-user').textContent=session.user.email;
 const style=document.createElement('style');style.textContent='#commission-save-notice{margin:14px 40px 0 278px;padding:14px 18px;border:1px solid #c9e3d8;border-left:4px solid #008777;border-radius:9px;background:#eff9f4;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:30;font:12px system-ui;color:#244f43}#commission-save-notice strong{display:block;font-size:14px}#commission-save-detail{display:block;margin-top:4px;line-height:1.5}#commission-save-notice[data-state=saving]{background:#fff8e8;border-color:#e9c978;color:#765717}#commission-save-notice[data-state=error]{background:#fff0ee;border-color:#d96959;color:#8d3028}#commission-save-notice .save-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}#commission-save-notice button{white-space:nowrap}#commission-save-notice button[hidden]{display:none}@media(max-width:900px){#commission-save-notice{margin:12px 16px;flex-wrap:wrap}}@media print{#commission-save-notice{display:none!important}}';document.head.append(style);
 const bar=document.createElement('div');bar.id='commission-save-notice';bar.role='status';bar.innerHTML='<div><strong id="commission-save-label"></strong><span id="commission-save-detail"></span></div><div class="save-actions"><button id="commission-save-retry" hidden>Retry save</button><button id="commission-save-backup" hidden>Download unsaved draft</button><button id="commission-save-reload" hidden>Reload shared data</button></div>';byId('shared-controls').insertAdjacentElement('afterend',bar);
 const reload=()=>{if(saving){status('Please wait for saving to finish.');return}if(pending.size||stopped){if(!confirm('Download your unsaved draft first if you need to keep these edits. Discard the unsaved browser draft and load the latest shared data?'))return;window.localStorage.removeItem(draftKey());pending.clear();stopped=false}location.reload()};
 byId('commission-save-retry').onclick=()=>{stopped=false;lastError='';flush()};byId('commission-save-backup').onclick=backupDraft;byId('commission-save-reload').onclick=reload;byId('shared-reload').onclick=reload;byId('shared-signout').onclick=signout;
 window.addEventListener('beforeunload',e=>{if(saving||pending.size||stopped){e.preventDefault();e.returnValue=''}});window.addEventListener('online',()=>{if(stopped&&!conflict){stopped=false;flush()}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!stopped)flush()});
 if(draftWarning)status(draftWarning,true);else if(pending.size){status('Saving recovered draft…');queueMicrotask(flush)}else status('Shared data loaded');
 }
 async function load(){msg('Opening shared workspace…');const membership=await request('commission_access?select=email,access_role&enabled=eq.true');if(membership?.length!==1)throw Error('This account has not been granted access to the calculator.');if(membership[0].access_role==='viewer')throw Error('This calculator currently supports administrator and editor access. Read-only access is not enabled yet.');const [datasets,releases]=await Promise.all([request('commission_datasets?select=scope,plan_year,payload,revision'),request('commission_releases?release_id=eq.current&enabled=eq.true&select=html,draft_number')]);if(!releases?.length)throw Error('The calculator release is not available.');for(const row of datasets){const key=storageKey(row);if(key){memory.set(key,JSON.stringify(row.payload.value));versions.set(key,row.revision)}}let draft=null;try{draft=JSON.parse(window.localStorage.getItem(draftKey())||'null')}catch(e){}if(draft?.entries?.length){const safe=draft.entries.every(e=>versions.get(e.key)===e.revision||equalJson(JSON.parse(memory.get(e.key)||'null'),e.value));if(safe){for(const e of draft.entries){memory.set(e.key,JSON.stringify(e.value));pending.set(e.key,e.value)}}else{stopped=true;conflict=true;draftWarning=lastError='An earlier unsaved draft was found, but newer shared data exists. Download the draft to reconcile it. Current shared data is loaded; the draft has not overwritten it.'}}window.CommissionCloud={storage,attach};document.open();document.write(releases[0].html);document.close()}
 byId('login').onsubmit=async e=>{e.preventDefault();byId('signin').disabled=true;msg('Signing in…');try{const r=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:byId('email').value.trim(),password:byId('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Sign-in failed. Check your email and password.');remember(d);byId('password').value='';await load()}catch(err){msg(err.message);if(byId('signin'))byId('signin').disabled=false}};
 try{session=JSON.parse(window.localStorage.getItem(SESSION)||'null')}catch(e){}if(session){byId('signin').disabled=true;load().catch(e=>{msg(e.message);window.localStorage.removeItem(SESSION);session=null;byId('signin').disabled=false})}
})();
